<!doctype html>
<html lang="ru" data-palette="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SelfRead" />
    <title>SelfRead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Manrope:wght@400..800&family=PT+Serif:wght@400;700&family=Onest:wght@400..800&family=Cormorant+Garamond:wght@500..700&family=Golos+Text:wght@400..800&display=swap"
    />
    <script>
      // Палитра применяется до отрисовки, чтобы не было «вспышки» чужих цветов
      try {
        var t = JSON.parse(localStorage.getItem("sr-theme") || "null") || { palette: "paper" };
        var p = t.auto ? (matchMedia("(prefers-color-scheme: dark)").matches ? t.night : t.day) : t.palette;
        p = p || "paper";
        document.documentElement.dataset.palette = p;
        document.documentElement.classList.toggle("dark", p === "library");
        var colors = { paper: "#F6F1E7", ink: "#EEF1F5", library: "#14231D" };
        document.querySelector('meta[name="theme-color"]').setAttribute("content", colors[p] || colors.paper);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
